name: IndexNow after production deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Submit the live sitemap URLs to IndexNow
        run: |
          python3 <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          host = "www.chalamandramagistral.com"
          base = "https://" + host
          key = Path("public/ffe446a24dd9e7aad5e9d9287a6c0d90.txt").read_text(
              encoding="utf-8"
          ).strip()
          if not re.fullmatch(r"[a-f0-9]{32}", key):
              raise SystemExit("La clave IndexNow no tiene formato hexadecimal válido.")

          key_url = f"{base}/{key}.txt"
          sitemap_url = f"{base}/sitemap.xml"

          def get_bytes(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Chalamandra-DecoX-IndexNow/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.status, response.read()

          last_error = None
          for attempt in range(1, 31):
              try:
                  key_status, remote_key = get_bytes(key_url)
                  sitemap_status, sitemap_body = get_bytes(sitemap_url)
                  if (
                      key_status == 200
                      and remote_key.decode("utf-8").strip() == key
                      and sitemap_status == 200
                  ):
                      break
                  last_error = "La clave o el sitemap público todavía no coincide."
              except Exception as exc:
                  last_error = str(exc)
              if attempt < 30:
                  print(f"Esperando publicación pública ({attempt}/30): {last_error}")
                  time.sleep(10)
          else:
              raise SystemExit(f"El sitio no publicó clave/sitemap válidos: {last_error}")

          root = ET.fromstring(sitemap_body)
          urls = [
              node.text.strip()
              for node in root.iter()
              if node.tag.rsplit("}", 1)[-1] == "loc" and node.text
          ]
          if not urls:
              raise SystemExit("El sitemap público no contiene URLs.")

          for url in urls:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != host:
                  raise SystemExit(f"URL de sitemap fuera del host canónico: {url}")

          payload = {
              "host": host,
              "key": key,
              "keyLocation": key_url,
              "urlList": urls,
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read().decode("utf-8", errors="replace")
          print(f"IndexNow HTTP {status}; URLs notificadas: {len(urls)}")
          if status not in (200, 202):
              raise SystemExit(f"IndexNow rechazó la solicitud: HTTP {status} {body}")
          PY
