name: Site quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, routes, tests and Vercel build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source syntax
        run: pnpm lint

      - name: Test source routes and markup
        run: pnpm test

      - name: Build Vercel output
        run: pnpm run vercel-build

      - name: Test generated deploy output
        run: pnpm run test:build

      - name: TypeScript scope
        shell: bash
        run: |
          if git ls-files '*.ts' '*.tsx' '*.mts' '*.cts' | grep -q .; then
            echo "TypeScript files detected; configure a real typecheck before passing CI."
            exit 1
          fi
          echo "Not applicable: this repository has no TypeScript sources."
